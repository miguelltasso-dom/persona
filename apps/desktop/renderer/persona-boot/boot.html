<persona-boot id="persona-boot-overlay"><template shadowrootmode="open"><link rel="stylesheet" href="/__persona-boot-ui__/boot.css"><main class="boot" data-state="splash" data-scene="off">
  <aside class="rail" aria-hidden="true">
    <div class="brand">
      <span class="badge"><img src="/__persona-boot-ui__/assets/symbol.svg" alt="" width="26" height="30"></span>
      <span class="word">Persona</span>
    </div>
    <ul class="places">
      <li class="place" aria-disabled="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3.5 11.5 12 4l8.5 7.5v8a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg><span data-i18n="placeOverview">Visão geral</span></li>
      <li class="place" aria-disabled="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 7.5 12 3l9 4.5-9 4.5zM3 12l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5"/></svg><span data-i18n="placeProjects">Projetos</span></li>
      <li class="place" aria-disabled="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 4v16M11 11l2 2 4-4"/></svg><span data-i18n="placeApprovals">Aprovações</span></li>
      <li class="place" aria-disabled="true"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="9" cy="8" r="3"/><path d="M3 19v-1a6 6 0 0 1 12 0v1zM16 5.5a3 3 0 0 1 0 5.8M17 13a5 5 0 0 1 4 5v1h-3"/></svg><span data-i18n="placeTeam">Equipe</span></li>
      <li class="place" aria-disabled="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 6C9.5 3.5 6 3 3.5 4.5v13c2.5-1.5 6-1 8.5 1.5 2.5-2.5 6-3 8.5-1.5v-13C18 3 14.5 3.5 12 6zM12 6v13"/><path d="M6.5 8h2M15.5 8h2M6.5 11h2M15.5 11h2"/></svg><span data-i18n="placeMemory">Memória da empresa</span></li>
    </ul>
    <div class="foliage"></div>
  </aside>

  <div class="stage">
    <section class="splash" aria-labelledby="boot-status">
      <div class="lamp" aria-hidden="true"><img src="/__persona-boot-ui__/assets/lamp.webp" alt="" width="92" height="114"></div>
      <div class="faces" aria-hidden="true"></div>
      <div class="phrase">
        <p class="status" id="boot-status" role="status" aria-live="polite"></p>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <p class="hint" id="boot-hint" hidden></p>
    </section>

    <section class="error" aria-labelledby="boot-error-title" hidden>
      <img class="pose" src="/__persona-boot-ui__/assets/atlas-erro.webp" alt="" width="180" height="180">
      <h1 id="boot-error-title" tabindex="-1" data-i18n="errorTitle">Não conseguimos abrir a Persona</h1>
      <p class="body" id="boot-error-body" data-i18n="errorGeneric">Isso costuma se resolver tentando de novo. Se continuar, reinicie o computador.</p>
      <div class="actions">
        <button type="button" class="primary" id="boot-retry" data-i18n="retry">Tentar de novo</button>
        <button type="button" class="link" id="boot-copy" data-i18n="copyDiag">Ver o que aconteceu</button>
      </div>
      <details class="details" id="boot-details">
        <summary data-i18n="details">Detalhes para o suporte</summary>
        <code id="boot-diag">boot_timeout</code>
      </details>
    </section>
  </div>
</main></template></persona-boot>

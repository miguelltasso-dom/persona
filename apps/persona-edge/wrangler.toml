# Persona edge. Local + dry-run only until Atlas releases a Cloudflare account (D-034 / E11).
# Never `wrangler login` or `wrangler deploy` without that release.
name = "persona-edge"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
# No public *.workers.dev address (P2-03a): the operator chooses a route when the account is released.
workers_dev = false

# Filled at first real deploy. Leave commented for dry-run / local.
# account_id = "REPLACE_AFTER_LOGIN"

[observability]
enabled = false

[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceHub"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "persona-edge-blobs"

# Plain, non-secret vars only. Secrets never live in this file: locally they are in .dev.vars (git-ignored; see .dev.vars.example), in production `wrangler secret put`.
[vars]
ENVIRONMENT = "local"

# Secrets (.dev.vars locally, `wrangler secret put` before a real deploy; see CLOUDFLARE-DEPLOY.md):
#   GITHUB_WEBHOOK_SECRET
#   PERSONA_SYNC_WRAP_KEY   (optional; payload encryption)
#   PERSONA_INVITE_PEPPER   (optional; invite token hash)

# [env.production]
# name = "persona-edge"
# workers_dev = false
# account_id = "REPLACE_AFTER_LOGIN"
# routes = [{ pattern = "edge.persona.example/*", zone_name = "example" }]

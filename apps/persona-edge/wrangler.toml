# Persona edge. Local + dry-run only until Atlas releases a Cloudflare account (D-034 / E11).
# Never `wrangler login` or `wrangler deploy` without that release.
name = "persona-edge"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Filled at first real deploy. Leave commented for dry-run / local.
# account_id = "REPLACE_AFTER_LOGIN"

[observability]
enabled = false

[[durable_objects.bindings]]
name = "WORKSPACE_HUB"
class_name = "WorkspaceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceHub"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "persona-edge-blobs"

# Plain vars only. Real secrets: `wrangler secret put` — never commit values.
[vars]
GITHUB_WEBHOOK_SECRET = "dev-only-local-secret"
ENVIRONMENT = "local"

# Secrets the operator must set before a real deploy (see CLOUDFLARE-DEPLOY.md):
#   GITHUB_WEBHOOK_SECRET
#   PERSONA_SYNC_WRAP_KEY   (optional; payload encryption)
#   PERSONA_INVITE_PEPPER   (optional; invite token hash)

# [env.production]
# name = "persona-edge"
# workers_dev = false
# account_id = "REPLACE_AFTER_LOGIN"
# routes = [{ pattern = "edge.persona.example/*", zone_name = "example" }]
